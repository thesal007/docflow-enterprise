services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17-alpine
    container_name: docflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-docflow}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docflow} -d ${POSTGRES_DB:-docflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - docflow-network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: docflow-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - docflow-network

  # ============================================================
  # NATS
  # ============================================================
  nats:
    image: nats:2-alpine
    container_name: docflow-nats
    restart: unless-stopped

    command:
      - "-js"
      - "-m"
      - "8222"

    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"

    volumes:
      - nats_data:/data

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - docflow-network

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: docflow-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docflow_password}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - docflow-network

  # ============================================================
  # MinIO bucket initialization
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: docflow-minio-init

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docflow_password}

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/documents;
      mc anonymous set none local/documents;
      exit 0;
      "

    networks:
      - docflow-network

# ==============================================================
# Volumes
# ==============================================================
volumes:
  postgres_data:
    name: docflow-postgres-data

  redis_data:
    name: docflow-redis-data

  nats_data:
    name: docflow-nats-data

  minio_data:
    name: docflow-minio-data

# ==============================================================
# Network
# ==============================================================
networks:
  docflow-network:
    name: docflow-network
    driver: bridge